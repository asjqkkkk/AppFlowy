name: Trigger Public Repository CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop, release/*]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-public-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CI in public repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: AppFlowy-IO/AppFlowy-CI
          event-type: private-repo-webhook
          client-payload: |
            {
              "event_type": "${{ github.event_name == 'pull_request_target' && 'pr_opened' || 'push' }}",
              "pr_number": "${{ github.event.number }}",
              "pr_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}",
              "pr_repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
              "pr_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "workflows": "rust,flutter,ios"
            }