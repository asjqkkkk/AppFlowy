name: Fork CI Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-from-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Log PR information
        run: |
          echo "PR from fork: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "PR branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR SHA: ${{ github.event.pull_request.head.sha }}"
          echo "This workflow runs but cannot access secrets"